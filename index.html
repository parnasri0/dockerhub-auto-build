<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Circuit — Week Cards</title>
<style>
:root{--ink:#f3dccb;--or:#e8774a;--or2:#ffb27d;--bg:#1a0c13;--gr:#235a2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(#1a0c13 0,#1a0c13 25%,var(--gr) 100%) fixed;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);-webkit-tap-highlight-color:transparent}
#st{position:relative;height:100%;max-height:100vh;aspect-ratio:1148/1600;max-width:100vw;margin:0 auto;container-type:size;user-select:none;-webkit-user-select:none;overflow:hidden}
#st img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.circ{clip-path:inset(45% 34% 33.5% 33%);-webkit-mask-image:radial-gradient(circle at 49.5% 55.6%,#000 calc(var(--cr,0px) - 30px),transparent var(--cr,0px));mask-image:radial-gradient(circle at 49.5% 55.6%,#000 calc(var(--cr,0px) - 30px),transparent var(--cr,0px))}
.full{-webkit-mask-image:radial-gradient(circle at 49.5% 55.6%,#000 calc(var(--r,0px) - 170px),transparent var(--r,0px));mask-image:radial-gradient(circle at 49.5% 55.6%,#000 calc(var(--r,0px) - 170px),transparent var(--r,0px))}
.glow{position:absolute;left:32.2%;top:44.1%;width:34.7%;height:23.1%;border-radius:4%;pointer-events:none;box-shadow:0 0 3cqw #e8774a55,inset 0 0 3cqw #e8774a33;animation:pulse 3.4s ease-in-out infinite;opacity:0;transition:opacity 1s}
.on .glow{opacity:1}
@keyframes pulse{50%{box-shadow:0 0 6cqw #e8774a99,inset 0 0 5cqw #e8774a55}}
.star{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;will-change:transform}
.star::before{content:"";position:absolute;left:-6cqw;top:-6cqw;width:12cqw;height:12cqw;border-radius:50%;background:radial-gradient(circle,#fff3c4 0,#ffc65a 8%,#f08a3c55 28%,transparent 62%);mix-blend-mode:screen}
.star::after{content:"";position:absolute;left:-7cqw;top:-.18cqw;width:14cqw;height:.36cqw;background:linear-gradient(90deg,transparent,#ffd98a,transparent);box-shadow:0 0 1.2cqw #ffb347;transform:rotate(-24deg);filter:blur(.4px)}
.star.rest{animation:twk 2.6s ease-in-out infinite}
@keyframes twk{50%{filter:brightness(1.5) drop-shadow(0 0 1.6cqw #ffb347)}}
.ghost{position:absolute;left:41%;top:46%;width:17%;height:19%;pointer-events:none;opacity:0;transition:opacity .6s;transform:translate(var(--gx,0px),var(--gy,0px)) scale(calc(1 + var(--p,0)*1.4));mix-blend-mode:screen}
.ghost i{position:absolute;inset:0;opacity:.7;background:radial-gradient(circle at 50% 45%,#fff6dc 0,#ffd9a0 18%,#e8774a99 45%,#7be08d33 70%,transparent 75%);filter:blur(5px);animation:morph 5s ease-in-out infinite}
.ghost b{position:absolute;top:40%;width:7%;height:12%;background:#1a0c13;border-radius:50%;opacity:.7;filter:blur(2px)}
.ghost b:nth-child(2){left:36%}.ghost b:nth-child(3){right:36%}
@keyframes morph{0%,100%{border-radius:52% 48% 60% 40%/50% 55% 45% 50%}33%{border-radius:40% 60% 45% 55%/60% 40% 60% 40%}66%{border-radius:60% 40% 55% 45%/42% 58% 42% 58%}}
.on .ghost{animation:flt 4s ease-in-out infinite}
@keyframes flt{50%{margin-top:-1.4cqw}}
.chip{position:absolute;left:32.2%;top:44.1%;width:34.7%;height:23.1%;border:0;background:transparent;cursor:pointer;touch-action:none;-webkit-touch-callout:none;border-radius:4%;outline-offset:4px}
.chip:focus-visible{outline:2px solid var(--or2)}
.card{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;padding:0;background:#1a1a1a;color:var(--ink);border:1px solid #e8774a55;border-radius:.6cqw;font:inherit;opacity:0;transform:scale(.3) rotate(-8deg);transition:opacity .6s,transform .7s cubic-bezier(.2,1.5,.4,1),border-color .3s;pointer-events:none;perspective:600px}
.card.show{opacity:1;transform:none}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 2.4cqw #ffb27dcc,inset 0 0 1.6cqw #e8774a66;opacity:0;transition:opacity .35s}
.card .k{font-size:1.15cqw;letter-spacing:.35em;color:#e8774acc}
.card b{font:700 4.2cqw/1 Georgia,serif;color:var(--or2)}
.card i{font-size:1cqw;font-style:normal;opacity:0;transform:translateY(.6cqw);transition:.3s;color:#ffd9bd}
.ready .card{pointer-events:auto;cursor:pointer}
.ready.hov .card::after{opacity:.35}
.ready .card:hover,.ready .card:focus-visible{border-color:var(--or2);transform:translateY(-.5cqw) scale(1.06) rotateX(8deg);outline:none}
.ready .card:hover::after,.ready .card:focus-visible::after{opacity:1}
.ready .card:hover i,.ready .card:focus-visible i{opacity:1;transform:none}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#ffd9bdcc;pointer-events:none;opacity:0;transition:opacity 1s;text-shadow:0 1px 8px #000}
.hint.v{opacity:1}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#0008;color:var(--ink);border:1px solid #e8774a66;border-radius:99px;padding:8px 14px;font:inherit;font-size:12px;cursor:pointer}
#doc{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0508d9;backdrop-filter:blur(6px);z-index:9;padding:16px}
#doc.o{display:flex}
#doc .pn{position:relative;width:min(720px,100%);max-height:100%;overflow:auto;background:#150b10;border:1px solid #e8774a88;border-radius:10px;padding:clamp(22px,5vw,48px);box-shadow:0 0 60px #e8774a33;transform-origin:var(--ox,50%) var(--oy,50%);animation:op .5s cubic-bezier(.2,1,.3,1)}
@keyframes op{from{transform:scale(.12);opacity:0}}
#doc .wk{font-size:12px;letter-spacing:.4em;color:var(--or)}
#doc h2{font:700 clamp(30px,6vw,52px)/1.05 Georgia,serif;margin:.3em 0 .6em;color:var(--or2)}
#doc p,#doc li{font:16px/1.65 Georgia,serif;color:#e9d3c3}
#doc .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid #e8774a88;background:none;color:var(--ink);font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.glow,.star.rest,.ghost i,.on .ghost{animation:none}}
</style></head><body>

<script>
(()=>{
const CARDS=[[60.37, 40.0, 12.02, 8.69, 1, 0.309], [10.98, 51.0, 12.11, 10.06, 2, 0.436], [23.08, 31.19, 12.11, 8.75, 3, 0.464], [0.44, 39.12, 7.58, 10.88, 4, 0.642], [35.19, 16.88, 12.11, 8.69, 5, 0.653], [78.75, 26.25, 12.11, 8.75, 6, 0.665], [60.28, 15.19, 12.2, 13.63, 7, 0.668], [9.32, 10.88, 12.02, 8.75, 8, 0.883], [28.22, 0.19, 12.11, 7.31, 9, 0.989], [84.23, 6.44, 12.11, 8.75, 10, 1.0]];
const st=document.getElementById('st'),chip=document.getElementById('chip'),gh=document.getElementById('gh'),star=document.getElementById('star'),hint=document.getElementById('hint'),snd=document.getElementById('snd'),doc=document.getElementById('doc');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=1,H=1;
const size=()=>{const r=st.getBoundingClientRect();W=r.width;H=r.height};
size();addEventListener('resize',size);
/* ---- cards ---- */
const els=CARDS.map(c=>{const b=document.createElement('button');b.type='button';b.className='card';
 b.style.cssText=`left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%`;
 b.setAttribute('aria-label','Open week '+c[4]);
 b.innerHTML=`<span class="k">WEEK</span><b>${String(c[4]).padStart(2,'0')}</b><i>open &#8599;</i>`;
 b.tabIndex=-1;b.onclick=()=>openDoc(c[4],b);st.appendChild(b);return b});
/* ---- state ---- */
let intro=false,done=false,hold=false,over=false,p=0;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const cx=()=>W*.4955,cy=()=>H*.5565,cornerX=()=>W*.327,cornerY=()=>H*.49;
const setStar=(x,y,s,o)=>{star.style.transform=`translate(${x}px,${y}px) scale(${s})`;star.style.opacity=o};
let t0=performance.now(),lx=0,ly=0;
function runIntro(t){
 if(t<1400){const u=t/1400;setStar(cx(),cy(),.2+.8*ease(u),ease(u));}
 else if(t<7200){const u=(t-1400)/5800,r=Math.pow(u,.9)*W*.25,a=u*26;
  lx=cx()+r*Math.cos(a);ly=cy()+r*Math.sin(a)*.93;setStar(lx,ly,1,1);st.style.setProperty('--cr',(r+W*.02)+'px');}
 else if(t<8800){const u=ease((t-7200)/1600);setStar(lx+(cornerX()-lx)*u,ly+(cornerY()-ly)*u,1,1);st.style.setProperty('--cr',W*.4+'px');}
 else finishIntro();
}
function finishIntro(){intro=true;st.style.setProperty('--cr',W+'px');setStar(cornerX(),cornerY(),1,1);star.classList.add('rest');st.classList.add('on');chip.disabled=false;hint.classList.add('v')}

/* ---- loop ---- */
let last=performance.now(),shown=CARDS.map(()=>false),R=1;
function tick(now){
 const dt=Math.min(64,now-last);last=now;
 if(!intro)runIntro(now-t0);
 else{
  if(!done){
   p+= hold ? dt/(RM?500:2400) : -dt/1500;
   p=Math.max(0,Math.min(1,p));
   if(p>=1){done=true;st.classList.add('ready');els.forEach(e=>e.tabIndex=0);hint.textContent='Hover the fruits \u00b7 click a card to open';}
  }
  R=H*1.05+W*.1;
  st.style.setProperty('--r',(ease(p)*R)+'px');
  gh.style.setProperty('--p',done?0:p);
  gh.style.opacity=(over||hold)&&!done?1:(over?1:0);
  CARDS.forEach((c,i)=>{const s=done||p>.28+.62*c[5];if(s!==shown[i]){shown[i]=s;els[i].classList.toggle('show',s)}});
  level=hold?.12+.1*p:over?.085:done?(hov?.06:.02):.012;
  if(g)g.gain.setTargetAtTime(1,ctx.currentTime,.2);

}

/* ---- pointer ---- */
let hov=false;
const rel=e=>{const r=chip.getBoundingClientRect();return[(e.clientX-r.left-r.width/2),(e.clientY-r.top-r.height/2)]};
chip.addEventListener('pointerenter',()=>{over=true;audio()});
chip.addEventListener('pointerleave',()=>{if(!hold)over=false;gh.style.setProperty('--gx','0px');gh.style.setProperty('--gy','0px')});
chip.addEventListener('pointermove',e=>{const[x,y]=rel(e);gh.style.setProperty('--gx',x*.35+'px');gh.style.setProperty('--gy',y*.35+'px')});
chip.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();chip.setPointerCapture(e.pointerId);hold=true;audio()});
const end=()=>{hold=false};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>chip.addEventListener(n,end));
addEventListener('blur',end);addEventListener('pointerup',end);
chip.addEventListener('contextmenu',e=>e.preventDefault());
chip.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hold=true;over=true;audio()}});
chip.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){hold=false}});
chip.addEventListener('blur',()=>{hold=false;over=false});
st.addEventListener('pointerenter',()=>{hov=true;st.classList.add('hov')});
st.addEventListener('pointerleave',()=>{hov=false;st.classList.remove('hov')});
els.forEach(e=>{e.addEventListener('pointerenter',()=>{over=false;lvlBoost=true;audio()});e.addEventListener('pointerleave',()=>{lvlBoost=false})});
let lvlBoost=false;
/* ---- whispers (synthesised, no assets) ---- */
let ctx=null,g=null,nb=null,level=.012,on=false;
function audio(){
 if(!on||ctx&&ctx.state==='running')return;
 try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();
  if(!g){g=ctx.createGain();g.gain.value=1;g.connect(ctx.destination);
   nb=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;whisper()}}catch(e){}
}
function whisper(){
 if(ctx&&ctx.state==='running'&&on){
  const lv=(lvlBoost?.14:level)*(.6+Math.random()*.8),dur=.5+Math.random()*1.1,now=ctx.currentTime;
  const s=ctx.createBufferSource();s.buffer=nb;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=3+Math.random()*4;
  const f0=1400+Math.random()*2400;f.frequency.setValueAtTime(f0,now);f.frequency.linearRampToValueAtTime(f0*(.6+Math.random()*.9),now+dur);
  const a=ctx.createGain();a.gain.setValueAtTime(0,now);a.gain.linearRampToValueAtTime(lv,now+dur*.35);a.gain.linearRampToValueAtTime(0,now+dur);
  const pn=ctx.createStereoPanner?ctx.createStereoPanner():null;
  s.connect(f);f.connect(a);if(pn){pn.pan.value=Math.random()*2-1;a.connect(pn);pn.connect(g)}else a.connect(g);
  s.start(now,Math.random()*2,dur+.1);
 }
 setTimeout(whisper,(lvlBoost||over||hold?350:1100)+Math.random()*(lvlBoost||over||hold?700:2600));
}
snd.onclick=()=>{on=!on;snd.innerHTML=on?'&#9835; whispers on':'&#9835; whispers off';if(on)audio()};
/* ---- doc ---- */
let from=null;
const TOPICS=['Foundations','Signals','Memory','Logic','Pathways','Patterns','Systems','Security','Integration','Launch'];
function openDoc(w,btn){
 from=btn;const r=btn.getBoundingClientRect(),pn=doc.querySelector('.pn');
 pn.style.setProperty('--ox',(r.left+r.width/2)+'px');pn.style.setProperty('--oy',(r.top+r.height/2)+'px');
 document.getElementById('dw').textContent='WEEK '+String(w).padStart(2,'0');
 document.getElementById('dt').textContent=TOPICS[(w-1)%TOPICS.length];
 document.getElementById('db').innerHTML='<p>This is the document for week '+w+'. Replace this text with your own content.</p><ul><li>Goals for the week</li><li>Key notes &amp; links</li><li>Tasks and outcomes</li></ul>';
 doc.classList.add('o');doc.querySelector('.x').focus();
}
function closeDoc(){doc.classList.remove('o');if(from)from.focus()}
doc.querySelector('.x').onclick=closeDoc;
doc.addEventListener('pointerdown',e=>{if(e.target===doc)closeDoc()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&doc.classList.contains('o'))closeDoc()});
})();
</script></body></html>
